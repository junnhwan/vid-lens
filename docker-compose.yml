services:
  # =========================================
  # 1. Redis (缓存 + 分布式锁)
  # =========================================
  redis:
    image: redis:latest
    container_name: vidlens-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    networks:
      - vidlens-net

  # =========================================
  # 2. MinIO (对象存储)
  # =========================================
  minio:
    image: minio/minio
    container_name: vidlens-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      # 挂老仓库 vid-lens-727 的 MinIO 数据（含历史视频对象）
      - ../vid-lens-727/data/minio:/data
    networks:
      - vidlens-net

  # =========================================
  # PostgreSQL + pgvector (primary application database)
  # Stores relational business data and RAG vectors; starts by default.
  # =========================================
  postgres:
    image: pgvector/pgvector:pg17
    container_name: vidlens-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: vidlens
      POSTGRES_PASSWORD: vidlens
      POSTGRES_DB: vidlens
      TZ: Asia/Shanghai
    volumes:
      # 挂老仓库 vid-lens-727 的 PG 数据（含历史任务/转写/摘要/chunk/聊天）
      - ../vid-lens-727/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - vidlens-net

  # =========================================
  # 3. RabbitMQ (消息队列 — 任务可靠投递)
  # 选 RabbitMQ 而非 Kafka：vid-lens 的 MQ 痛点是任务可靠投递 + 失败可恢复
  # + 削峰（ASR 配额有限），不是高吞吐日志聚合；Kafka 的 partition/ISR/高吞吐
  # 特性在用户级并发吞吐下用不上。详见 docs/decisions/02-dispatch-consistency.md。
  # =========================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: vidlens-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 管理面（DLQ 重投在此操作）
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - vidlens-net

  # =========================================
  # 4. Prometheus / Grafana（可选可观测性栈）
  # docker compose --profile observability up -d prometheus grafana
  # =========================================
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: vidlens-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - vidlens-net

  grafana:
    image: grafana/grafana:12.0.2
    container_name: vidlens-grafana
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - vidlens-net

volumes:
  prometheus-data:
  grafana-data:

networks:
  vidlens-net:
    driver: bridge
