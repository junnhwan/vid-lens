name: vid-lens-core

services:
  # =========================================
  # 1. Redis (缓存 + 分布式锁)
  # =========================================
  redis:
    image: redis:latest
    container_name: vidlens-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    networks:
      - vidlens-net

  # =========================================
  # 2. MinIO (对象存储)
  # =========================================
  minio:
    image: minio/minio
    container_name: vidlens-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      # Override VIDLENS_DATA_ROOT locally to reuse an existing data root.
      - ${VIDLENS_DATA_ROOT:-./data}/minio:/data
    networks:
      - vidlens-net

  # =========================================
  # PostgreSQL + pgvector (primary application database)
  # Stores relational business data and RAG vectors; starts by default.
  # =========================================
  postgres:
    image: pgvector/pgvector:pg17
    container_name: vidlens-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: vidlens
      POSTGRES_PASSWORD: vidlens
      POSTGRES_DB: vidlens
      TZ: Asia/Shanghai
    volumes:
      # Override VIDLENS_DATA_ROOT locally to reuse an existing data root.
      - ${VIDLENS_DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - vidlens-net

  # =========================================
  # 3. RabbitMQ (消息队列 — 任务可靠投递)
  # 选 RabbitMQ 而非 Kafka：vid-lens 的 MQ 痛点是任务可靠投递 + 失败可恢复
  # + 削峰（ASR 配额有限），不是高吞吐日志聚合；Kafka 的 partition/ISR/高吞吐
  # 特性在用户级并发吞吐下用不上。详见 docs/decisions/02-dispatch-consistency.md。
  # =========================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: vidlens-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 管理面（DLQ 重投在此操作）
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - vidlens-net

networks:
  vidlens-net:
    driver: bridge
