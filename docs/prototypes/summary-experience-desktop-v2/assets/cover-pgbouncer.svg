<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2a3a"/><stop offset="1" stop-color="#0d141c"/></linearGradient>
    <pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="640" height="360" fill="url(#g)"/>
  <rect width="640" height="360" fill="url(#p)"/>
  <circle cx="540" cy="70" r="150" fill="#336791" opacity=".28"/>
  <g transform="translate(372 96)">
    <rect width="232" height="168" rx="12" fill="#0b1118" stroke="#2c3e50"/>
    <g font-family="SF Mono, Menlo, monospace" font-size="13" fill="#9fb3c8">
      <text x="18" y="34" fill="#e2a84b">[pgbouncer]</text>
      <text x="18" y="62">pool_mode = transaction</text>
      <text x="18" y="88">default_pool_size = 20</text>
      <text x="18" y="114">max_client_conn = 500</text>
      <text x="18" y="148" fill="#f87171">no more connections</text>
    </g>
  </g>
  <text x="36" y="118" font-size="40" font-weight="800" fill="#ffffff">PgBouncer</text>
  <text x="36" y="166" font-size="30" font-weight="700" fill="#cfe3f5">连接池实战</text>
  <text x="38" y="206" font-size="16" fill="#8fb0cc">配置 / 压测 / 报错排查</text>
  <rect x="36" y="236" width="150" height="34" rx="17" fill="#e2a84b"/>
  <text x="111" y="258" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1308">transaction 模式</text>
  <text x="620" y="344" text-anchor="end" font-size="11" fill="#ffffff" fill-opacity=".45">演示封面</text>
</svg>
