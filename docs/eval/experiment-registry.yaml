registry_version: "1"

experiments:
  - experiment_id: "rerank-vs-none-dev"
    dataset_version: "real-v1"
    status: preregistered
    baseline_variant: "rrf_fusion"
    # rrf_fusion.yaml sha256 (offline-file hash, 与 strict loadRetrievalConfigs 一致)
    baseline_config_sha256: "91446d3d73fbefbcd8c713f16108046b9c0c1c880345fd419303dae9a2ac699c"
    # production_adoption (spec 04 B段, 2026-07-28)：rerank 默认值接入
    # cmd/server/wiring.go productionRetrievalConfig——reranker_mode 默认从
    # none 改为 deterministic（dev 消融 +0.102 CI[0,+0.204] passed）。
    # cfg.RerankModel 非空时仍升级 model rerank（显式覆盖路径，lift 未由本
    # 实验证明）。BM25 hybrid 非单变量未评测，线上保守关闭。
    production_adoption:
      adopted_on: "2026-07-28"
      target: "cmd/server/wiring.go productionRetrievalConfig"
      change: "rerank default none→deterministic (deterministic-v1)"
      evidence: "dev split 6 case, nDCG@5 0.731→0.833, +0.102, 95% CI [0,+0.204]"
      honest: "deterministic 代理非真实 model-rerank; BM25 hybrid 非单变量未评测保守关闭; dev 非 sealed"
    frozen_evidence:
      corpus_sha256: "22e1fb7d01052da297037fcab499ecc6de27cc8e3121e73ebb7924f19bbf211d"
      chunk_manifest_sha256: "84ef05257c96bf55a1b314238042279e4177fe96ddb9552f13c615b818dc6fb8"
      vector_artifact_sha256: "057b2608ca41ae47069b341b92809037a1591718fd50e16f9e65573f09e7a3d4"
    primary_metric: "ndcg_at_k"
    direction: "higher"
    minimum_effect: 0.0
    bootstrap:
      iterations: 5000
      confidence_level: 0.95
      seed: 7
    guardrails:
      - metric: "answerability_f1"
        direction: "higher"
        max_regression: 0.0
    candidates:
      - variant_id: "rrf_rerank"
        commit: "9cf851f"
        # rrf_rerank.yaml sha256
        config_sha256: "bc7e20dc2243a3b9fab12ba26b0656fc9c23e4a9d199fe1581f1997227ac5692"
  - experiment_id: "model-rerank-vs-none-dev"
    dataset_version: "real-v1"
    status: preregistered
    baseline_variant: "rrf_fusion"
    # 同 rrf_fusion baseline（sha 与 rerank-vs-none-dev 实验一致）
    baseline_config_sha256: "91446d3d73fbefbcd8c713f16108046b9c0c1c880345fd419303dae9a2ac699c"
    # HONEST: model rerank 调外部 API（Qwen3-Reranker-4B），不可 bit-identical
    # 复现。frozen evidence 三 sha 复用 deterministic 那次（索引未变：corpus/
    # chunks/vectors 相同），但 model rerank 不进 frozen evidence 锁，结果表
    # 标注 non-sealed external API。与 rerank-vs-none-dev (deterministic) 并列
    # 对比：测 model cross-encoder 相对 none 的 lift，回答"deterministic 代理
    # 是否能代表真实 model"。
    sealed: false
    external_api: true
    frozen_evidence:
      corpus_sha256: "22e1fb7d01052da297037fcab499ecc6de27cc8e3121e73ebb7924f19bbf211d"
      chunk_manifest_sha256: "84ef05257c96bf55a1b314238042279e4177fe96ddb9552f13c615b818dc6fb8"
      vector_artifact_sha256: "057b2608ca41ae47069b341b92809037a1591718fd50e16f9e65573f09e7a3d4"
    primary_metric: "ndcg_at_k"
    direction: "higher"
    minimum_effect: 0.0
    bootstrap:
      iterations: 5000
      confidence_level: 0.95
      seed: 7
    guardrails:
      - metric: "answerability_f1"
        direction: "higher"
        max_regression: 0.0
    candidates:
      - variant_id: "rrf_model_rerank"
        commit: "__PENDING_RUN__"
        # rrf_model_rerank.yaml sha256
        config_sha256: "2e8669346c2e323c63525424d2c033fa58ef872fe4ab8d4f27cf817f907385f6"
