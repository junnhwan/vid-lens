# Ablation variant: bm25_hybrid.
# Vector + BM25 hybrid retrieval (RRF fusion is intrinsic to the hybrid path:
# ValidateSingleVariableAblation requires rrf_k>0 whenever both retrievers are
# on). Query remains original; no rerank. Compared vs vector_only baseline.
name: bm25_hybrid
enable_vector: true
enable_bm25: true
query_mode: original
rewrite_queries: 1
top_k: 5
candidate_k: 20
rrf_k: 60
neighbor_radius: 0
max_context_chars: 0
min_vector_score: 0
chunker_strategy: recursive_sentence
chunker_version: recursive-sentence-v1
chunk_size: 800
chunk_overlap: 100
reranker_mode: none
reranker_version: none-v0
