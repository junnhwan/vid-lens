# Ablation variant: rrf_rerank (CANDIDATE vs rrf_fusion baseline).
# Single-variable: only reranker changes (none → deterministic). neighbor_radius
# and max_context_chars stay 0 so the factor changed is exactly "reranker".
# HONEST LABEL: strict eval 无真实 ModelRerankerFactory，用 deterministic 代理
# (per model_rerank.yaml 注释)。测的是 deterministic rerank 相对 none 的提升，
# 不是真实 model-rerank lift。Compared vs rrf_fusion baseline.
name: rrf_rerank
enable_vector: true
enable_bm25: true
query_mode: rewrite
rewrite_queries: 3
top_k: 5
candidate_k: 20
rrf_k: 60
neighbor_radius: 0
max_context_chars: 0
min_vector_score: 0
chunker_strategy: fixed_window
chunker_version: split-text-v1
chunk_size: 800
chunk_overlap: 120
reranker_mode: deterministic
reranker_version: deterministic-v1
