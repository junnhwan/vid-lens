# Ablation variant: rrf_fusion.
# Vector + BM25 with multi-query rewrite and reciprocal-rank-fusion fusion
# (rewrite produces multiple sub-queries whose ranks are RRF-merged). Rerank
# remains off. Compared vs vector_only baseline. The single added capability
# vs bm25_hybrid is the rewrite+fusion path; vs vector_only it adds BM25 +
# fusion together (progressive chain, not strict single-variable).
name: rrf_fusion
enable_vector: true
enable_bm25: true
query_mode: rewrite
rewrite_queries: 3
top_k: 5
candidate_k: 20
rrf_k: 60
neighbor_radius: 0
max_context_chars: 0
min_vector_score: 0
chunker_strategy: fixed_window
chunker_version: split-text-v1
chunk_size: 800
chunk_overlap: 120
reranker_mode: none
reranker_version: none-v0
