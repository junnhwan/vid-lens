# Ablation variant: vector_only (BASELINE).
# Pure vector search, no BM25, no rerank, original (un-rewritten) query.
# Single-variable baseline against which bm25_hybrid / rrf_fusion / model_rerank
# are compared via paired bootstrap (spec 01 §消融实验配置 / CI 形式).
#
# NOTE on single-variable intent: the four variants are a progressive chain
# (vector → +BM25 → +RRF fusion → +rerank). Each adjacent pair adds one
# capability; CI comparisons are each-vs-vector_only baseline per spec 01.
name: vector_only
enable_vector: true
enable_bm25: false
query_mode: original
rewrite_queries: 1
top_k: 5
candidate_k: 5
rrf_k: 0
neighbor_radius: 0
max_context_chars: 0
min_vector_score: 0
chunker_strategy: fixed_window
chunker_version: split-text-v1
chunk_size: 800
chunk_overlap: 120
reranker_mode: none
reranker_version: none-v0
