# Ablation variant: rrf_model_rerank (CANDIDATE vs rrf_fusion baseline).
# Single-variable: only reranker changes (none → model cross-encoder). neighbor_radius
# and max_context_chars stay 0 so the factor changed is exactly "reranker".
# HONEST LABEL: model rerank 调外部 API（Qwen3-Reranker-4B over SiliconFlow
# /v1/rerank），不可 bit-identical 复现，因此本档不进 frozen evidence 三 sha256
# 锁，结果表标注 non-sealed external API。endpoint 由 admin profile 的
# embedding_endpoint 推导（factory.go deriveRerankEndpointFromEmbedding）。
# Compared vs rrf_fusion baseline (rerank=none). model 由 config.yaml
# rag.rerank_model 注入 productionEvidenceRetriever.rerankModel。
name: rrf_model_rerank
enable_vector: true
enable_bm25: true
query_mode: rewrite
rewrite_queries: 3
top_k: 5
candidate_k: 20
rrf_k: 60
neighbor_radius: 0
max_context_chars: 0
min_vector_score: 0
chunker_strategy: fixed_window
chunker_version: split-text-v1
chunk_size: 800
chunk_overlap: 120
reranker_mode: model
reranker_version: Qwen/Qwen3-Reranker-4B
