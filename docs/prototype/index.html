<div class="app">
  <!-- 左侧导航 -->
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">映知</div>
        <div class="brand-sub">VIDLENS</div>
      </div>
    </div>
    <button class="nav-item" data-nav="#/dashboard"><svg class="ic"><use href="#i-home"/></svg>工作台</button>
    <button class="nav-item" data-nav="#/library"><svg class="ic"><use href="#i-video"/></svg>视频库</button>
    <button class="nav-item" data-nav="#/kb"><svg class="ic"><use href="#i-folder"/></svg>知识库</button>
    <div class="nav-sep">快速开始</div>
    <button class="nav-item" data-nav="#/video/12"><svg class="ic"><use href="#i-play"/></svg>打开示例视频</button>
    <button class="nav-item" data-nav="#/chat/v/12"><svg class="ic"><use href="#i-message"/></svg>体验 Agent 问答</button>
    <div class="rail-spacer"></div>
    <button class="nav-item" data-nav="#/settings"><svg class="ic"><use href="#i-settings"/></svg>设置</button>
    <div class="rail-user" data-nav="#/settings">
      <div class="avatar">周</div>
      <div class="who"><b>周衍</b><span>个人工作区</span></div>
    </div>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="topbar-spacer"></div>
      <div class="searchbox" id="globalSearch"><svg class="ic ic-sm"><use href="#i-search"/></svg>搜索视频、知识库、会话<kbd>/</kbd></div>
      <button class="btn btn-primary btn-sm" data-open-upload><svg class="ic ic-sm"><use href="#i-upload"/></svg>上传视频</button>
    </header>

    <div class="content" id="content">
      <!-- 各页面由路由渲染 -->
    </div>
  </div>
</div>

<!-- 浮层容器 -->
<div id="overlayRoot"></div>
<div class="toasts" id="toasts"></div>

<div class="demo-bar" id="demoBar">
  <div class="brand-mark"></div>
  <span><b>映知</b>·产品 UI 交互原型,数据均为演示模拟</span>
  <svg class="x ic ic-sm" id="demoBarClose"><use href="#i-x"/></svg>
</div>

<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
