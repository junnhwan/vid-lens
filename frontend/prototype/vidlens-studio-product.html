/* VidLens Studio: a warmer reading canvas around the existing full product flow. */
body.studio-product.light {
  --bg: #eef1e9;
  --panel: #fbfcf7;
  --surface: #f2f5ed;
  --hover: #e7ede2;
  --line: #dbe2d7;
  --strong: #c9d4c7;
  --text: #21352b;
  --sub: #395147;
  --muted: #66796e;
  --dim: #87988b;
  --gold: #52745a;
  --gold-bg: #e3eddf;
  --green: #427b55;
  --red: #b65e50;
  --blue: #497d8b;
}
body.studio-product { font-size: 14px; letter-spacing: .005em; }
body.studio-product .app { grid-template-columns: 205px minmax(0, 1fr); }
body.studio-product .rail {
  background: #193029;
  color: #dce9dd;
  border-right: 1px solid #28463b;
  padding: 27px 13px 16px;
}
body.studio-product .brand { padding-bottom: 28px; }
body.studio-product .brand-mark { color: #d4dba8; }
body.studio-product .brand b { color: #f4f7ec; font-size: 20px; }
body.studio-product .brand small { color: #9eb5a3; }
body.studio-product .rail .nav { color: #becdc2; border-radius: 8px; }
body.studio-product .rail .nav:hover { background: #29443a; color: #fff; }
body.studio-product .rail .nav.active { background: #365346; color: #f0f8e6; }
body.studio-product .rail-label { color: #849e8e; }
body.studio-product .rail-sep, body.studio-product .profile { border-color: #355044; }
body.studio-product .rail .profile { color: #e6f0e8; }
body.studio-product .rail .profile small { color: #a5bdad; }
body.studio-product .rail .avatar { border-color: #718d6f; background: #355547; color: #e2f0d6; }
body.studio-product .topbar {
  height: 62px;
  background: #fbfcf7;
  border-bottom: 1px solid #dce3d8;
  padding-inline: clamp(22px, 2.6vw, 44px);
}
body.studio-product .crumbs b { color: #294337; font-weight: 650; }
body.studio-product .demo-label { color: #748b77; font-size: 10px; }
body.studio-product .content { background: #eef1e9; }
body.studio-product .page { max-width: 1510px; padding: clamp(25px, 3vw, 44px) clamp(20px, 3vw, 44px) 68px; }
body.studio-product h1, body.studio-product .page-head h1 { font-family: var(--serif); font-weight: 650; letter-spacing: -.035em; }
body.studio-product .page-head h1 { font-size: clamp(26px, 2.8vw, 39px); }
body.studio-product .eyebrow { color: #597b60; letter-spacing: .18em; }
body.studio-product .card, body.studio-product .hero, body.studio-product .vcard,
body.studio-product .kb-card, body.studio-product .scope-card, body.studio-product .artifact-card {
  background: #fbfcf7;
  border-color: #dbe2d7;
  box-shadow: 0 11px 30px rgba(36, 64, 44, .045);
}
body.studio-product .btn { border-radius: 8px; transition: background .18s, border-color .18s, transform .18s; }
body.studio-product .btn:hover { transform: translateY(-1px); border-color: #849e86; }
body.studio-product .btn.primary { background: #315e48; border-color: #315e48; color: #f7fcf4; }
body.studio-product .btn.primary:hover { background: #244d3a; border-color: #244d3a; filter: none; }
body.studio-product .btn.ghost { color: #52705a; }
body.studio-product .tag.gold { background: #e7eddd; color: #557348; }
body.studio-product .tag.green { background: #e0efdf; color: #39784b; }
body.studio-product .tag.red { background: #f6e6e1; color: #b85f4d; }
body.studio-product .segments { background: #e9eee5; border-color: #d5dfd2; }
body.studio-product .segments button.active { background: #fbfcf7; color: #294734; }

"/>',target:'\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"5\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"1\"/>',lock:'\u003crect x=\"5\" y=\"10\" width=\"14\" height=\"11\" rx=\"2\"/>\u003cpath d=\"M8 10V6a4 4 0 0 1 8 0v4M12 14v3\"/>',refresh:'\u003cpath d=\"M20 8a8 8 0 0 0-14-3L3 8m0-5v5h5M4 16a8 8 0 0 0 14 3l3-3m0 5v-5h-5\"/>',volume:'\u003cpath d=\"M3 9h4l5-4v14l-5-4H3zM16 8a6 6 0 0 1 0 8M19 5a10 10 0 0 1 0 14\"/>',chart:'\u003cpath d=\"M3 3v18h18M7 16v-5M12 16V6M17 16v-8\"/>',bookmark:'\u003cpath d=\"M6 3h12v18l-6-4-6 4z\"/>',task:'\u003crect x=\"4\" y=\"4\" width=\"16\" height=\"17\" rx=\"2\"/>\u003cpath d=\"M9 4V2h6v2M8 10l2 2 4-4M8 16h8\"/>',lightbulb:'\u003cpath d=\"M9 18h6M9 21h6M8 15a7 7 0 1 1 8 0c-1 1-1 2-1 3H9c0-1 0-2-1-3\"/>'};\nfunction icon(name,cls=''){return `\u003csvg class=\"icon ${cls}\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">${paths[name]||paths.file}\u003c/svg>`}\nfunction icons(root=document){root.querySelectorAll('[data-icon]').forEach(e=>{e.innerHTML=icon(e.dataset.icon);e.removeAttribute('data-icon')})}\nfunction esc(s){return String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\nconst $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];\nconst brand='\u003csvg viewBox=\"0 0 32 32\" fill=\"none\" aria-hidden=\"true\">\u003crect x=\".5\" y=\".5\" width=\"31\" height=\"31\" rx=\"9\" fill=\"#30372a\" stroke=\"#50573b\"/>\u003cpath d=\"m16 5.6 8.9 5.2v10.4L16 26.4l-8.9-5.2V10.8z\" stroke=\"#d6ad64\" stroke-width=\"1.4\"/>\u003cpath d=\"m16 10 5.2 3v6L16 22l-5.2-3v-6z\" stroke=\"#d6ad64\" opacity=\".6\"/>\u003ccircle cx=\"16\" cy=\"16\" r=\"3\" fill=\"#d6ad64\"/>\u003c/svg>';\nconst sources=[{id:0,title:'Go 服务的 Docker 容器化实战',author:'工程实践课 · 第 01 讲',duration:'32:18',short:'DOCKER',color:'green'},{id:1,title:'Docker Compose：编排应用与数据库',author:'工程实践课 · 第 02 讲',duration:'28:46',short:'COMPOSE',color:'blue'},{id:2,title:'从可运行到可靠：生产部署检查',author:'技术分享 · 可靠性专题',duration:'24:05',short:'DEPLOY',color:'gold'}];\nconst tabs=[{id:'manual',name:'操作手册',icon:'file',count:'06'},{id:'study',name:'学习笔记',icon:'book',count:'05'},{id:'compare',name:'课程对照',icon:'compare',count:'03'},{id:'map',name:'知识导图',icon:'map',count:'12'}];\nconst steps=[{title:'准备项目与运行环境',time:'02:16',source:0,desc:'确认 Go 项目包含 go.mod 与 go.sum，Docker 已安装并运行。先在本地执行 go test ./...，确保应用处于可构建状态。',code:'go test ./...\\ndocker version',lang:'Terminal',note:'视频未指定本机操作系统；Windows 用户建议在 WSL 2 环境中执行。'},{title:'用多阶段构建分离编译与运行',time:'08:42',source:0,desc:'第一阶段完成 Go 编译，第二阶段只保留运行所需的二进制文件。构建工具不会进入最终镜像，让交付内容保持清晰。',code:'FROM golang:1.24-alpine AS builder\\nWORKDIR /app\\nCOPY go.mod go.sum ./\\nRUN go mod download\\nCOPY . .\\nRUN CGO_ENABLED=0 go build -o server ./cmd/server\\n\\nFROM alpine:3.21\\nWORKDIR /app\\nCOPY --from=builder /app/server .\\nENTRYPOINT [\"./server\"]',lang:'Dockerfile',note:'画面使用 CGO_ENABLED=0。如果项目依赖 CGO，需要重新确认运行时依赖。'},{title:'用 Compose 连接服务与 PostgreSQL',time:'11:28',source:1,desc:'在同一个 Compose 网络内，服务通过服务名访问数据库。把 DB_HOST 配置为 postgres；不要把容器中的 localhost 当作宿主机。',code:'services:\\n  app:\\n    build: .\\n    ports: [\"8080:8080\"]\\n    environment:\\n      DB_HOST: postgres\\n  postgres:\\n    image: postgres:17\\n    volumes: [\"pgdata:/var/lib/postgresql/data\"]\\nvolumes:\\n  pgdata:',lang:'compose.yaml',note:'示例省略了数据库凭据。真实部署应通过环境文件或密钥管理注入。'},{title:'配置持久化与环境变量',time:'16:35',source:1,desc:'把数据库文件映射到命名卷，将环境差异从镜像中分离。重建应用容器时保留数据库卷，避免把容器生命周期等同于数据生命周期。',code:'docker compose config\\ndocker compose up -d\\ndocker volume ls',lang:'Terminal',note:'请勿把 docker compose down -v 当作日常重启命令，它会删除命名卷。'},{title:'增加健康检查与启动依赖',time:'07:52',source:2,desc:'分别检查进程是否存活，以及服务是否具备接收业务请求的条件。只有依赖已经就绪，才把请求交给应用。',code:'healthcheck:\\n  test: [\"CMD\", \"wget\", \"-qO-\", \"http://localhost:8080/readyz\"]\\n  interval: 10s\\n  timeout: 3s\\n  retries: 3',lang:'compose.yaml',note:'就绪检查与存活检查用途不同，数据库暂不可用不一定需要重启应用。'},{title:'启动并验证部署结果',time:'20:16',source:2,desc:'查看服务状态、读取日志并请求健康端点。验证完成后记录当前镜像版本，后续更新时保留可回滚的版本。',code:'docker compose ps\\ndocker compose logs --tail 50 app\\ncurl http://localhost:8080/readyz',lang:'Terminal',note:'视频未演示完整回滚过程；发布前仍需结合你的部署环境补充回滚方案。'}];\nconst evidenceData=[{source:0,time:'02:16',end:'03:05',title:'项目结构与构建前检查',quote:'先确认这个项目在本地是能正常跑起来的，然后我们再把它放进容器。先跑一下测试，请求健康接口，再确认 Docker 服务已经启动。这里先用单个应用容器，数据库在外部，通过配置的地址连接。',highlight:'先确认这个项目在本地是能正常跑起来的'},{source:0,time:'08:42',end:'09:36',title:'多阶段构建的两个阶段',quote:'我们在 builder 这个阶段把 Go 程序编译出来。下面这个阶段只把编译好的文件拷贝过去，不需要把整个 Go 编译环境都带上。',highlight:'只把编译好的文件拷贝过去'},{source:1,time:'11:28',end:'12:21',title:'容器之间使用服务名通信',quote:'这里不能写 localhost，因为 localhost 指的是应用容器自己。数据库的服务名是 postgres，所以我们连接的主机名也写 postgres。应用通过 build 构建镜像，启动时要等待数据库就绪，不能只依赖容器的启动顺序。',highlight:'localhost 指的是应用容器自己'},{source:1,time:'16:35',end:'17:26',title:'容器与数据具有不同生命周期',quote:'容器可以删掉重新创建，但数据库的数据不能跟着丢。我们用一个命名卷保存这些文件，更新服务的时候不要删掉这个卷。连接配置通过环境变量传进来，不要写死在镜像里。',highlight:'数据库的数据不能跟着丢'},{source:2,time:'07:52',end:'08:39',title:'就绪状态不等于进程存活',quote:'进程启动只是第一步。服务能不能接请求，还要看数据库连接和初始化有没有完成，所以需要一个单独的就绪检查。数据库地址按部署环境配置，检查实际连接是否成功。',highlight:'需要一个单独的就绪检查'},{source:2,time:'20:16',end:'21:03',title:'验证服务与保留回滚版本',quote:'部署完不要只看容器是不是 running。我们检查日志，再请求一下健康接口。部署使用明确的镜像版本，这个版本也要记下来，方便以后回滚。数据库备份不能只看有没有文件，上线前还要验证能否恢复。',highlight:'不要只看容器是不是 running'}];\nconst STORAGE='vidlens-workspace-prototype-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch{}\nconst state={tab:'manual',step:1,evidence:1,evTab:'transcript',done:saved.done||[0],edits:saved.edits||{},version:saved.version||3,theme:saved.theme||'day',focus:false,mobileEvidence:false,editing:false,quizChoice:null,quizDone:false,quizIndex:0,concept:0,diffOnly:false,mapKind:'mindmap',zoom:1,selectedNode:'docker',modal:null,recipe:'manual',sourceSelected:[0,1,2],goal:'',task:null,created:saved.created||[],note:saved.note||'',decision:saved.decision||'',nodeEdits:saved.nodeEdits||{},chapterIndex:0,play:false,seconds:522,response:'',filename:'',history:saved.history||[]};let taskTimer=null,playTimer=null,toastTimer=null,returnFocus=null;\nfunction persist(){try{localStorage.setItem(STORAGE,JSON.stringify({done:state.done,edits:state.edits,version:state.version,theme:state.theme,created:state.created,note:state.note,decision:state.decision,nodeEdits:state.nodeEdits,history:state.history}))}catch{toast('浏览器未允许本地保存，本次修改仍保留在页面中。')}}\nfunction toast(msg){clearTimeout(toastTimer);$('#toastRoot').innerHTML=`\u003cdiv class=\"toast\">${icon('check')}${esc(msg)}\u003c/div>`;toastTimer=setTimeout(()=>$('#toastRoot').innerHTML='',3200)}\nfunction fmt(seconds){return Math.floor(seconds/60).toString().padStart(2,'0')+':'+Math.floor(seconds%60).toString().padStart(2,'0')}\nfunction timeSeconds(s){const a=s.split(':').map(Number);return a[0]*60+a[1]}\nfunction cite(n,label){return `\u003cbutton class=\"cite\" data-action=\"cite\" data-id=\"${n}\" aria-label=\"查看 ${esc(label||evidenceData[n].time)} 的视频证据\">${icon('play')}${esc(label||evidenceData[n].time)}\u003c/button>`}\nfunction renderSidebar(){const activeSource=evidenceData[state.evidence].source;$('#sidebar').innerHTML=`\u003cdiv class=\"brand\">${brand}\u003cdiv class=\"brand-name\">映知 \u003cspan>VIDLENS\u003c/span>\u003c/div>\u003c/div>\u003cbutton class=\"workspace-switch\" data-action=\"projects\">\u003cspan class=\"ws-icon\">${icon('folder')}\u003c/span>\u003cspan>\u003cstrong>后端工程实践\u003c/strong>\u003csmall>个人工作空间\u003c/small>\u003c/span>\u003cspan class=\"spacer\">\u003c/span>${icon('down')}\u003c/button>\u003cbutton class=\"nav-btn active\" data-action=\"workspace\">${icon('grid')}成果工作台\u003cspan class=\"num\">${4+state.created.length}\u003c/span>\u003c/button>\u003cbutton class=\"nav-btn\" data-action=\"library\">${icon('video')}视频资料\u003cspan class=\"num\">${sources.length.toString().padStart(2,'0')}\u003c/span>\u003c/button>\u003cbutton class=\"nav-btn\" data-action=\"shelf\">${icon('layers')}所有成果\u003cspan class=\"num\">${4+state.created.length}\u003c/span>\u003c/button>\u003cbutton class=\"nav-btn\" data-action=\"tasks\">${icon('task')}运行任务\u003cspan class=\"num\">${state.task&&state.task.status==='running'?'01':'00'}\u003c/span>\u003c/button>\u003cdiv class=\"label\">工作空间资料\u003c/div>\u003cdiv class=\"source-list\">${sources.map(s=>`\u003cbutton class=\"source-item ${s.id===activeSource?'selected':''}\" data-action=\"source\" data-id=\"${s.id}\">\u003cspan class=\"source-thumb\">${(s.id+1).toString().padStart(2,'0')}\u003c/span>\u003cspan>\u003cb>${esc(s.title)}\u003c/b>\u003csmall>${esc(s.duration)} · ${s.id\u003c3?'已解析':'演示资料'}\u003c/small>\u003c/span>\u003c/button>`).join('')}\u003c/div>\u003cbutton class=\"source-add\" data-action=\"add\">${icon('plus')}添加资料\u003c/button>\u003cdiv class=\"sidebar-bottom\">\u003cdiv class=\"local-label\">${icon('lock')}仅在当前浏览器保存原型修改\u003c/div>\u003cdiv class=\"sidebar-profile\">\u003cdiv class=\"avatar\">周\u003c/div>\u003cdiv>\u003cstrong>我的工作空间\u003c/strong>\u003csmall>个人版 · 原型预览\u003c/small>\u003c/div>\u003cspan class=\"spacer\">\u003c/span>\u003cbutton class=\"iconbtn\" data-action=\"settings\" aria-label=\"原型设置\">${icon('settings')}\u003c/button>\u003c/div>\u003c/div>`}\nfunction renderTabs(){$('#tabs').innerHTML=tabs.map(t=>`\u003cbutton class=\"tab ${state.tab===t.id?'active':''}\" data-action=\"tab\" data-id=\"${t.id}\" aria-current=\"${state.tab===t.id?'page':'false'}\">${icon(t.icon)}${t.name}\u003cspan class=\"tab-count\">${t.count}\u003c/span>\u003c/button>`).join('')}\nfunction renderToolbar(){const names={manual:'图文步骤',study:'概念与练习',compare:'来源对照',map:'可视化视图'};$('#toolbar').innerHTML=`\u003cspan class=\"pill green\">${icon('check')}已生成\u003c/span>\u003cspan class=\"save-state\">${names[state.tab]} · 保存在此浏览器\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cbutton class=\"btn ghost\" data-action=\"history\">${icon('history')}v${state.version}\u003c/button>\u003cbutton class=\"btn ghost\" data-action=\"export\">${icon('download')}导出\u003c/button>\u003cbutton class=\"btn ${!state.focus?'':'ghost'}\" data-action=\"evidence-toggle\" title=\"显示或隐藏视频证据\">${icon('panel')}证据\u003c/button>`;$('#workspace').className='workspace'+(state.focus?' focus':'')+(state.mobileEvidence?' evidence-mobile':'')}\nfunction codeHtml(code){return esc(code).split('\\n').map(line=>line.replace(/^(FROM|WORKDIR|COPY|RUN|ENTRYPOINT)(.*)$/,'\u003cspan class=\"kw\">$1\u003c/span>$2')).join('\\n')}\nfunction manual(){return `\u003carticle class=\"article\">\u003cdiv class=\"between\">\u003cspan class=\"doc-kicker\">FIELD GUIDE / 001\u003c/span>\u003cspan class=\"pill gold\">可编辑手册\u003c/span>\u003c/div>\u003ch2>Go 服务容器化部署手册\u003c/h2>\u003cdiv class=\"doc-meta\">\u003cspan class=\"flex\">${icon('video')}3 个视频来源\u003c/span>\u003cspan>·\u003c/span>\u003cspan>6 个步骤\u003c/span>\u003cspan>·\u003c/span>\u003cspan class=\"mono\">v${state.version}\u003c/span>\u003c/div>\u003cp class=\"doc-intro\">把本地运行的 Go 服务打包成镜像，连接数据库，并完成上线前的基础检查。每一步都可以回到课程里核对。\u003c/p>\u003cdiv class=\"prerequisites\">\u003cstrong>开始之前\u003c/strong>\u003ccode>Go 1.24\u003c/code>\u003ccode>Docker\u003c/code>\u003ccode>Compose v2\u003c/code>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"selection-hint\">${icon('check')}${state.done.length}/6 已完成\u003c/span>\u003c/div>${steps.map((s,i)=>`\u003csection class=\"step\" id=\"step-${i}\">\u003cdiv class=\"step-head\">\u003cbutton class=\"step-number ${state.done.includes(i)?'done':state.step===i?'current':''}\" data-action=\"complete\" data-id=\"${i}\" aria-label=\"${state.done.includes(i)?'取消完成':'标记完成'}步骤 ${i+1}\">${state.done.includes(i)?icon('check'):String(i+1).padStart(2,'0')}\u003c/button>\u003cbutton class=\"step-toggle\" data-action=\"step\" data-id=\"${i}\" aria-expanded=\"${state.step===i}\">${s.title}\u003c/button>\u003cbutton class=\"step-time\" data-action=\"cite\" data-id=\"${i}\">${icon('play')}${s.time}\u003c/button>\u003cbutton class=\"iconbtn\" data-action=\"step\" data-id=\"${i}\" aria-label=\"${state.step===i?'收起':'展开'}步骤\">${icon(state.step===i?'down':'chevron')}\u003c/button>\u003c/div>${state.step===i?`\u003cdiv class=\"step-body\">${state.editing?`\u003ctextarea class=\"editor\" id=\"stepEditor\" aria-label=\"编辑步骤说明\">${esc(state.edits[i]||s.desc)}\u003c/textarea>\u003cdiv class=\"step-actions\">\u003cbutton class=\"btn primary small\" data-action=\"save-edit\">保存修改\u003c/button>\u003cbutton class=\"btn small\" data-action=\"cancel-edit\">取消\u003c/button>\u003c/div>`:`\u003cp>${esc(state.edits[i]||s.desc)} ${cite(i)} ${state.edits[i]?'\u003cspan class=\"pill gold\">已手动修改\u003c/span>':''}\u003c/p>`}${i===1?`\u003cdiv class=\"flow-strip\">\u003cdiv class=\"flow-box\">builder\u003csmall>编译 Go 程序\u003c/small>\u003c/div>${icon('arrow')}\u003cdiv class=\"flow-box\">server\u003csmall>复制二进制文件\u003c/small>\u003c/div>${icon('arrow')}\u003cdiv class=\"flow-box\">runtime\u003csmall>精简运行环境\u003c/small>\u003c/div>\u003c/div>`:''}\u003cdiv class=\"codebox\">\u003cdiv class=\"codebar\">${icon('file')}&nbsp; ${s.lang}\u003cspan class=\"spacer\">\u003c/span>\u003cbutton class=\"iconbtn\" data-action=\"copy-code\" data-id=\"${i}\" aria-label=\"复制代码\">${icon('copy')}\u003c/button>\u003c/div>\u003cpre>\u003ccode>${codeHtml(s.code)}\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"callout\">${icon('alert')}\u003cspan>${s.note}\u003c/span>\u003c/div>\u003cdiv class=\"step-actions\">\u003cbutton class=\"btn small\" data-action=\"edit\">${icon('edit')}编辑这一步\u003c/button>\u003cbutton class=\"btn small\" data-action=\"improve\" data-id=\"${i}\">${icon('spark')}补充说明\u003c/button>\u003cbutton class=\"btn ghost small\" data-action=\"complete\" data-id=\"${i}\">${icon(state.done.includes(i)?'check':'circle')}${state.done.includes(i)?'已完成':'标记完成'}\u003c/button>\u003c/div>\u003c/div>`:''}\u003c/section>`).join('')}\u003cdiv class=\"doc-footer\">${icon('link')}正文与代码均为原型示例，可点击时间码体验证据回看。\u003c/div>\u003c/article>`}\nconst concepts=[{title:'镜像与容器',sub:'理解交付与运行',icon:'layers',heading:'镜像是模板，容器是一次运行',body:'镜像保存应用代码与运行环境。容器是镜像启动后的实例，拥有自己的进程和文件系统视图。更新应用时，通常创建新镜像并替换容器，而不是在运行中的容器里手动改代码。',analogy:'可以把镜像理解为一份食谱，容器是按食谱做出来的一道菜。同一份食谱可以做出多道菜，修改其中一道不会改变食谱。',ev:1},{title:'容器网络',sub:'找到正确的地址',icon:'map',heading:'localhost 到底是谁的“本机”？',body:'每个容器有自己的网络环境。应用容器里的 localhost 指向应用容器自己，而不是数据库容器。同一个 Compose 网络中，使用服务名 postgres 才能找到数据库。',analogy:'服务名就像同一栋楼里的房间号。说“我这里”只会指向自己的房间，告诉对方具体房间号才能找到目标。',ev:2},{title:'就绪与存活',sub:'理解可靠性检查',icon:'target',heading:'启动了，不代表准备好了',body:'存活检查关注进程是否还能正常工作；就绪检查关注服务此刻能否接收请求。连接数据库、加载必要配置等初始化完成后，服务才应该被标记为就绪。',analogy:'餐厅开灯了，说明它还在营业；厨房和食材准备好了，才适合让客人下单。两个信号不应该混为一谈。',ev:4}];\nconst quizzes=[{q:'应用和 PostgreSQL 分别运行在 Compose 容器中。应用应该用哪个地址连接数据库？',options:['localhost:5432','postgres:5432','0.0.0.0:5432'],answer:1,ev:2,feedback:'同一个 Compose 网络里，服务名可以被解析。localhost 指向应用容器自身，0.0.0.0 通常用于监听地址。'}, {q:'应用进程已经启动，但数据库连接尚未初始化完成。此时应该如何表示服务状态？',options:['进程已启动，所以直接接收业务流量','立刻重启整个数据库','存活检查可通过，就绪检查暂不通过'],answer:2,ev:4,feedback:'存活与就绪表达不同状态。初始化期间可保持进程运行，在依赖准备好后再让服务接收业务流量。'}];\nfunction study(){const c=concepts[state.concept],q=quizzes[state.quizIndex];return `\u003carticle class=\"article\">\u003cdiv class=\"between\">\u003cspan class=\"doc-kicker\">LEARNING NOTES / 002\u003c/span>\u003cspan class=\"pill green\">理解，然后应用\u003c/span>\u003c/div>\u003ch2>容器化部署的三个关键概念\u003c/h2>\u003cdiv class=\"doc-meta\">\u003cspan>整理自 3 段课程\u003c/span>\u003cspan>·\u003c/span>\u003cspan>笔记与原视频关联\u003c/span>\u003c/div>\u003cp class=\"doc-intro\">先建立清晰的概念，再用一个小问题检查理解。不必从头重看，遇到疑问可以直接回到相关片段。\u003c/p>\u003cdiv class=\"study-top\">${concepts.map((x,i)=>`\u003cbutton class=\"concept-card ${state.concept===i?'active':''}\" data-action=\"concept\" data-id=\"${i}\">${icon(x.icon)}\u003cstrong>${x.title}\u003c/strong>\u003csmall>${x.sub}\u003c/small>\u003c/button>`).join('')}\u003c/div>\u003ch3 class=\"section-title\">${c.heading}\u003c/h3>\u003cp class=\"note-prose\">${c.body} ${cite(c.ev)}\u003c/p>\u003cdiv class=\"analogy\">\u003cspan class=\"big-letter\">“\u003c/span>\u003cp>${c.analogy}\u003cbr>\u003cspan class=\"pill gold\" style=\"margin-top:8px\">辅助理解的类比 · 非视频原话\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"quiz\">\u003cdiv class=\"quiz-top\">${icon('target')}检查一下理解\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"mono\">0${state.quizIndex+1} / 02\u003c/span>\u003c/div>\u003ch3>${q.q}\u003c/h3>${q.options.map((o,i)=>`\u003cbutton class=\"option ${state.quizChoice===i?'selected':''} ${state.quizDone&&i===q.answer?'correct':''} ${state.quizDone&&state.quizChoice===i&&i!==q.answer?'wrong':''}\" data-action=\"quiz-option\" data-id=\"${i}\" ${state.quizDone?'disabled':''}>\u003cspan class=\"option-letter\">${'ABC'[i]}\u003c/span>${o}${state.quizDone&&i===q.answer?'\u003cspan class=\"spacer\">\u003c/span>'+icon('check'):''}\u003c/button>`).join('')}${state.quizDone?`\u003cdiv class=\"quiz-feedback\">\u003cstrong>${state.quizChoice===q.answer?'这道题答对了。':'这里有一个容易混淆的地方。'}\u003c/strong>\u003cbr>${q.feedback} ${cite(q.ev,'回看解释')}\u003c/div>`:''}\u003cdiv class=\"quiz-footer\">\u003cspan>反馈为模拟示例，不代表真实学习能力评估\u003c/span>\u003cbutton class=\"btn primary small\" data-action=\"${state.quizDone?'quiz-next':'quiz-submit'}\" ${state.quizChoice===null?'disabled':''}>${state.quizDone?'再练一道':'查看反馈'}${icon('arrow')}\u003c/button>\u003c/div>\u003c/div>\u003ch3 class=\"section-title\">我的理解\u003c/h3>\u003ctextarea class=\"input\" id=\"personalNote\" rows=\"3\" placeholder=\"用自己的话记下一个概念，或留下还没想明白的地方…\" aria-label=\"个人学习笔记\">${esc(state.note)}\u003c/textarea>\u003cdiv class=\"step-actions\">\u003cbutton class=\"btn small\" data-action=\"save-note\">${icon('bookmark')}保存笔记\u003c/button>\u003cbutton class=\"btn ghost small\" data-action=\"tab\" data-id=\"map\">${icon('map')}用导图梳理\u003c/button>\u003c/div>\u003cdiv class=\"doc-footer\">${icon('lock')}个人笔记只保存在当前浏览器，刷新后仍可查看。\u003c/div>\u003c/article>`}\nconst compareRows=[{name:'镜像构建',same:true,items:[['多阶段构建','编译环境与运行环境分开，镜像只保留需要的内容。',1],['复用构建结果','编排文件通过 build 配置构建应用镜像。',2],['固定镜像版本','部署引用明确版本，保留上一版本用于回滚。',5]]},{name:'数据库连接',same:false,items:[['使用外部连接地址','单容器演示，数据库运行在容器之外。',0],['使用 Compose 服务名','应用和数据库位于同一网络，通过 postgres 访问。',2],['以环境配置为准','关注连接是否可用，不固定数据库部署方式。',4]]},{name:'数据持久化',same:false,items:[['未覆盖','这段课程没有提供数据库卷配置。',null],['命名卷保存数据','容器重建后保留数据库文件。',3],['备份与恢复检查','明确指出上线前需要验证恢复路径。',5]]},{name:'健康检查',same:false,items:[['手动请求接口','验证应用启动后能返回响应。',0],['声明服务依赖','编排顺序需要结合实际就绪条件。',2],['区分存活和就绪','避免将初始化未完成误判为进程故障。',4]]}];\nfunction compare(){return `\u003cdiv class=\"comparison-wrap\">\u003cdiv class=\"comparison-head\">\u003cspan class=\"doc-kicker\">SIDE BY SIDE / 003\u003c/span>\u003ch2>三段课程，一份部署判断\u003c/h2>\u003cp>把建议放回它们各自的前提里。相同词语不一定指向相同场景，未提及的内容也不代表反对。\u003c/p>\u003c/div>\u003cdiv class=\"comparison-legend\">\u003cspan class=\"pill green\">3 个来源\u003c/span>\u003cspan class=\"pill gold\">3 处需结合前提理解\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003clabel class=\"toggle-check\">\u003cinput type=\"checkbox\" id=\"diffOnly\" ${state.diffOnly?'checked':''}>只看差异\u003c/label>\u003c/div>\u003cdiv class=\"comparison-table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>\u003cspan class=\"label\">比较维度\u003c/span>\u003c/th>${sources.slice(0,3).map((s,i)=>`\u003cth>\u003cspan class=\"source-no\">SOURCE 0${i+1}\u003c/span>\u003cstrong>${['容器化实战','Compose 编排','可靠性检查'][i]}\u003c/strong>\u003csmall>${s.duration} · ${['单个应用','多服务环境','生产运行'][i]}\u003c/small>\u003c/th>`).join('')}\u003c/tr>\u003c/thead>\u003ctbody>${compareRows.filter(r=>!state.diffOnly||!r.same).map(r=>`\u003ctr>\u003ctd>${r.name}\u003cbr>\u003cspan class=\"pill ${r.same?'green':'gold'}\" style=\"margin-top:9px\">${r.same?'互相补充':'不同前提'}\u003c/span>\u003c/td>${r.items.map(([title,desc,ev])=>`\u003ctd>\u003cstrong style=\"font-weight:500\">${title}\u003c/strong>\u003cp>${desc}\u003c/p>${ev===null?'\u003cspan class=\"pill\">未找到相关证据\u003c/span>':cite(ev)}\u003c/td>`).join('')}\u003c/tr>`).join('')}\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"compare-insight\">\u003ch3>${icon('lightbulb')} 关于“数据库地址”的差异\u003c/h3>\u003cp>第一段课程讨论单容器，第二段课程讨论 Compose 网络。这是部署环境不同，并非连接方式互相矛盾。你的应用如果采用 Compose，优先参考服务名通信的配置，并用就绪检查验证连接。${cite(2)}\u003c/p>\u003c/div>\u003cdiv class=\"step-actions\">\u003cbutton class=\"btn\" data-action=\"compare-note\">${icon('edit')}记录我的选择\u003c/button>\u003cbutton class=\"btn ghost\" data-action=\"generate\" data-recipe=\"compare\">${icon('plus')}换一个比较问题\u003c/button>\u003c/div>${state.decision?`\u003cdiv class=\"assistant-note\" style=\"margin-top:14px\">\u003cb>我的记录\u003c/b>\u003cbr>${esc(state.decision)}\u003c/div>`:''}\u003c/div>`}\nfunction graphNode(id,x,y,w,h,label,sub,fill,stroke,ev){label=esc(state.nodeEdits[id]?.label||label);return `\u003cg class=\"graph-node ${state.selectedNode===id?'selected':''}\" data-action=\"node\" data-id=\"${id}\" data-ev=\"${ev}\" role=\"button\" tabindex=\"0\" aria-label=\"查看 ${label} 的来源\">\u003crect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"9\" fill=\"${fill}\" stroke=\"${stroke}\"/>\u003ctext x=\"${x+17}\" y=\"${y+28}\" fill=\"#3a4932\" font-size=\"${w\u003c200&&label.length>8?12:16}\" font-weight=\"500\">${label}\u003c/text>\u003ctext x=\"${x+17}\" y=\"${y+48}\" fill=\"#829073\" font-size=\"10\">${sub}\u003c/text>\u003ccircle cx=\"${x+w-15}\" cy=\"${y+17}\" r=\"3\" fill=\"${stroke}\"/>\u003c/g>`}\nfunction mindmap(){return `\u003csvg class=\"graph-svg\" viewBox=\"0 0 950 575\" style=\"width:${state.zoom*100}%;height:${state.zoom*100}%;font-family:var(--ui)\" role=\"img\" aria-label=\"Go 服务部署知识导图\">\u003cg fill=\"none\" stroke-width=\"1.5\">\u003cpath d=\"M230 281 C275 281 269 112 320 112\" stroke=\"#9cac87\"/>\u003cpath d=\"M230 281 C275 281 270 286 320 286\" stroke=\"#a0b6c4\"/>\u003cpath d=\"M230 281 C275 281 267 463 320 463\" stroke=\"#c4b18a\"/>\u003cpath d=\"M490 112 C551 112 530 54 600 54M490 112H600M490 112 C551 112 530 170 600 170\" stroke=\"#a3b38e\"/>\u003cpath d=\"M490 286 C551 286 530 230 600 230M490 286H600M490 286 C551 286 530 346 600 346\" stroke=\"#a1b5c0\"/>\u003cpath d=\"M490 463 C551 463 530 405 600 405M490 463H600M490 function videoView(){const v=video(route.id);if(!v)return notFound();const readyState=v.status==='ready'||(v.status==='processing'&&db.jobs.some(j=>j.video===v.id&&j.job==='index'&&j.status==='running'));return `<div class="page">${heading(v.title,`${esc(v.file)} · ${esc(v.duration)} · ${esc(v.size)}　${status(v)}`,btn('','rename-video',v.id,'ghost','edit'))}<div class="video-workspace"><div>${screen(v)}<div class="transport">${readyState?btn('查看摘要','summary',v.id,'','file'):''}${v.status==='processing'?btn('处理中','view-video-task',v.id,'','clock'):btn(readyState?'重新转写':v.status==='failed'?'重试转写':'开始转写','transcribe',v.id,readyState?'':'primary','refresh')}${readyState?btn('重建索引','reindex',v.id,'','layers'):''}${btn('下载音频','audio',v.id,'','download')}${btn('加入知识库','add-video-kb',v.id,'','folder')}</div>${readyState?`<div class="row" style="margin:17px 0">${link('进入问答','/chat/video/'+v.id,'btn primary','message')}${btn('生成成果','generate-video',v.id,'','spark')}<span class="tag gold">新增成果能力</span></div><div class="card pad"><div class="between"><h3>从这个视频继续</h3><small class="dim">选择你的下一步</small></div><p class="muted" style="font-size:12px;margin-top:9px">遇到具体疑问，继续提问；需要整理或实践，把内容变成可保存的成果。</p><div class="suggestions">${['用多阶段构建解决了什么问题？','这段视频有哪些容易踩坑的地方？'].map(q=>`<button class="suggestion" data-a="ask-video" data-id="${v.id}" data-question="${q}">${q} ↗</button>`).join('')}</div><div class="launches">${recipes.filter(r=>r.id!=='compare').map(r=>`<button class="launch" data-a="quick-generate" data-id="${r.id}" data-video="${v.id}">${ico(r.icon)}<b>${r.name}</b><small>${r.desc}</small></button>`).join('')}<a class="launch" href="#/kb">${ico('compare')}<b>跨视频对照</b><small>到知识库选择多个来源</small></a></div></div>${section('这个视频参与的成果')}<div class="card">${db.artifacts.filter(a=>a.sources.includes(v.id)).map(a=>`<a class="list-row" href="#/artifacts/${a.id}">${ico(recipe(a.kind).icon)}<span class="grow"><b>${esc(a.title)}</b><p>${a.sources.length} 个来源 · ${a.origin}</p></span>${ico('chevron')}</a>`).join('')||'<div class="pad muted">还没有成果，生成第一份学习笔记吧。</div>'}</div>`:`<div class="notice ${v.status==='failed'?'error':''}" style="margin-top:20px">${ico(v.status==='failed'?'alert':'clock')}<span>${v.status==='uploaded'?'视频已导入，尚未开始转写。点击“开始转写”后，才能查看时间轴、建立索引和提问。':v.status==='failed'?'转写暂时失败，视频文件仍然保留。可以重试，并在任务中心查看处理进度。':'正在处理视频。可以离开此页，在任务中心查看后续进度。'}</span></div>${db.jobs.find(j=>j.video===v.id&&j.status==='running')?processRow(v):''}`}</div><div class="card video-panel"><nav class="tabs">${[['timeline','转写时间轴'],['frames','画面证据'],['index','检索索引']].map(([id,t])=>`<button data-a="video-tab" data-id="${id}" class="${ui.videoTab===id?'active':''}">${t}</button>`).join('')}</nav>${readyState?videoTabView(v):empty('等待处理完成','转写、画面证据和索引会在处理后显示。')}</div></div></div>`}
function videoTabView(v){if(ui.videoTab==='timeline')return `<div class="between" style="padding:8px 6px"><small class="muted">${v.chapters.length} 个示例片段</small>${tag('时间码为模拟')}</div>${v.chapters.map(([t,text],i)=>`<button class="timeline-row ${Math.abs(seconds(t)-ui.videoTime)<4?'active':''}" data-a="seek" data-id="${t}"><span class="time">${t}</span><div><p>${esc(text)}</p><small>解说转写 · 示例片段 ${i+1}</small></div></button>`).join('')}<div style="padding-top:17px">${btn('导出转写文本','export-transcript',v.id,'small','download')}</div>`;if(ui.videoTab==='frames')return `<div class="setting-row" style="padding-top:8px"><div><b>后续生成画面证据</b><p>影响下次转写，已有画面继续保留。</p></div><button class="switch ${v.visual?'on':''}" data-a="visual-toggle" data-id="${v.id}" role="switch" aria-label="生成画面证据" aria-checked="${v.visual}"></button></div><div class="frame-grid" style="margin-top:15px">${v.chapters.map(([t,text],i)=>`<button class="frame" data-a="evidence" data-id="${v.id}" data-chapter="${i}">${poster({...v,duration:t})}<p>${t}　${i%2?'画面描述':'OCR 文字'}<br><span class="dim">${esc(text.slice(0,35))}…</span></p></button>`).join('')}</div>`;return `<div style="padding:13px 0">${tag('当前索引可用','green')}</div>${[['向量模型','BAAI/bge-m3'],['向量维度','1024'],['证据类型','转写 / OCR / 画面描述'],['检索状态','已建立 · 模拟'],['示例片段',v.chapters.length+' 条']].map(([k,v])=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`).join('')}<p class="route-note" style="margin:16px 0">模型或内容变化后可重建索引。这里保留原有索引管理入口，数值为演示数据。</p>${btn('重建检索索引','reindex',v.id,'','refresh')}`}
function kbListView(){return `<div class="page">${heading('知识库','按主题组织视频，在明确的范围里检索、研究和生成成果。',btn('新建知识库','new-kb','','primary','plus'))}<div class="kb-grid">${db.kbs.map(k=>`<a href="#/kb/${k.id}" class="kb-card"><span class="icon-tile">${ico('folder')}</span><h2>${esc(k.name)}</h2><p>${esc(k.desc)}</p><div class="row"><span>${k.videos.length} 个视频</span><span>·</span><span>${k.videos.map(video).filter(v=>v?.status==='ready').length} 个可检索</span><span class="grow"></span>${ico('arrow')}</div></a>`).join('')}</div>${!db.kbs.length?empty('创建第一个知识库','把相关视频放在一起，进行跨视频研究。',btn('新建知识库','new-kb','','primary')):''}</div>`}
function kbDetailView(){const k=kb(route.id);if(!k)return notFound();const list=k.videos.map(video).filter(Boolean);return `<div class="page">${heading(k.name,`${esc(k.desc)}<br><span class="dim">${list.length} 个成员视频 · ${list.filter(v=>v.status==='ready').length} 个已建立索引</span>`,btn('','edit-kb',k.id,'ghost','edit')+btn('加入视频','manage-kb',k.id,'','plus'))}<div class="row wrap" style="margin-bottom:25px">${link('进入研究工作区','/chat/kb/'+k.id,'btn primary','message')}${btn('生成成果','generate-kb',k.id,'','spark')}<span class="grow"></span>${link('检索测试台','/kb/'+k.id+'/retrieval','btn ghost','search')}</div><nav class="tabs">${[['videos','成员视频 · '+list.length],['artifacts','关联成果 · '+db.artifacts.filter(a=>a.kb===k.id).length],['sessions','研究会话']].map(([id,t])=>`<button data-a="kb-tab" data-id="${id}" class="${ui.kbTab===id?'active':''}">${t}</button>`).join('')}</nav>${ui.kbTab==='videos'?`<div class="video-grid">${list.map(v=>videoCard(v)).join('')}</div>${!list.length?empty('还没有成员视频','加入视频后，就能在这个知识库中检索和研究。',btn('加入视频','manage-kb',k.id,'primary')):''}`:ui.kbTab==='artifacts'?`<div class="artifact-grid">${db.artifacts.filter(a=>a.kb===k.id).map(artifactCard).join('')}</div>${!db.artifacts.some(a=>a.kb===k.id)?empty('这个知识库还没有成果','可以先研究一个问题，或直接生成学习材料。',btn('生成成果','generate-kb',k.id,'primary')):''}`:`<div class="card">${db.sessions.filter(s=>s.scope==='kb'&&s.target===k.id).map(sessionRow).join('')||'<div class="pad muted">还没有研究会话。</div>'}</div>`}<p class="route-note" style="margin-top:25px">研究与成果只使用当前知识库选择的成员。移出成员不会删除视频本身。</p>${btn('删除知识库','delete-kb',k.id,'small ghost danger','trash')}</div>`}
function chatEntryView(){return `<div class="page">${heading('问答','先选择证据范围。Chat 适合具体问题，Agent 用于需要多步查证的分析。')}<div class="scope-grid"><a href="#/chat/library" class="scope-card"><span class="icon-tile">${ico('video')}</span><h3>问整个视频库</h3><p>从已建立索引的视频里寻找相关内容，不限定某个知识库。</p>${tag('Chat 检索问答')}<span style="float:right;color:var(--gold)">↗</span></a><div class="scope-card"><span class="icon-tile">${ico('folder')}</span><h3>在知识库中研究</h3><p>限定一组课程，比较观点、寻找证据，保留完整研究过程。</p>${db.kbs.map(k=>link(esc(k.name)+' ↗','/chat/kb/'+k.id,'suggestion')).join(' ')}</div><a href="#/library" class="scope-card"><span class="icon-tile">${ico('message')}</span><h3>问一段视频</h3><p>进入视频详情后选择问答。支持 Chat / Agent、引用回看和会话历史。</p>${tag('单视频范围')}<span style="float:right;color:var(--gold)">↗</span></a></div>${section('最近会话')}<div class="card">${db.sessions.map(sessionRow).join('')}</div>${section('选择视频开始提问')}<div class="video-grid">${ready().map(v=>`<div class="card">${poster(v)}<div class="pad"><h3 style="font-size:13px;margin-bottom:15px">${esc(v.title)}</h3>${link('问这段视频','/chat/video/'+v.id,'btn small','message')}</div></div>`).join('')}</div></div>`}
function chatView(){if(route.scope==='video'&&!video(route.target)||route.scope==='kb'&&!kb(route.target))return notFound();const s=chatSession(),source=scopeVideos(),running=ui.run?.session===s.id;ui.chatMode=s.mode;return `<div class="chat-layout"><div class="chat-main"><div class="chat-heading between"><div><h2>${route.scope==='video'?'问这段视频':route.scope==='kb'?'跨视频研究':'视频库问答'}</h2><p>${esc(scopeTitle())} · ${source.length} 个可检索来源</p></div><div class="row">${route.scope==='video'?link('视频详情','/video/'+route.target,'btn small ghost','video'):route.scope==='kb'?link('成员视频','/kb/'+route.target,'btn small ghost','folder'):''}<button class="ib" data-a="chat-rail" aria-label="查看执行过程">${ico('panel')}</button></div></div><div class="chat-messages">${s.messages.length?s.messages.map((m,i)=>m.role==='user'?`<div class="user-message">${esc(m.text)}</div>`:answerView(m,s,i)).join(''):`<div style="max-width:580px;margin:55px auto"><div class="eyebrow">ASK WITH CONTEXT</div><h1 style="font:500 29px var(--serif)">从一个好问题开始。</h1><p class="muted" style="font-size:13px;line-height:1.9;margin:18px 0">${route.scope==='library'?'我会在你已建立索引的视频中寻找相关内容。':'可以先概括内容，也可以带着具体问题回看画面和原文。'}回答中的引用可以打开证据。</p><div class="suggestions">${['梳理这些内容的关键概念','哪些操作步骤需要额外验证？','为什么要区分存活与就绪？'].map(q=>`<button class="suggestion" data-a="suggest-question" data-id="${q}">${q} ↗</button>`).join('')}</div></div>`}${running?`<div class="answer"><div class="answer-head">${logo()}正在${s.mode==='agent'?'分析证据':'检索内容'}… ${tag('模拟运行','gold')}</div><div class="shimmer" style="width:83%"></div><div class="shimmer" style="width:95%"></div><div class="shimmer" style="width:67%"></div></div>`:''}</div><form class="chat-composer" id="chatForm"><div class="row"><div class="segments"><button type="button" data-a="chat-mode" data-id="chat" class="${s.mode==='chat'?'active':''}">Chat</button>${route.scope!=='library'?`<button type="button" data-a="chat-mode" data-id="agent" class="${s.mode==='agent'?'active':''}">${route.scope==='kb'?'跨视频研究':'Agent'}</button>`:''}</div><span class="grow"></span><select id="chatProfile" aria-label="本次会话的 AI 配置" style="font-size:11px;padding:5px 8px;max-width:150px"><option value="0">默认 AI 配置</option>${db.profiles.map(p=>`<option value="${p.id}" ${s.profile===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><button type="button" class="ib" data-a="history" aria-label="历史会话">${ico('history')}</button><button type="button" class="ib" data-a="new-chat" aria-label="新建会话">${ico('plus')}</button></div><p class="mode-note">范围：${esc(scopeTitle())} · ${s.mode==='agent'?'规划、检索、补看证据并组织回答':'检索相关内容后直接回答'} · 使用“${esc(db.profiles.find(p=>p.id===s.profile)?.name||db.profiles.find(p=>p.default)?.name||'服务端默认')}”</p><div class="compose-box"><textarea id="chatInput" aria-label="输入问题" placeholder="${route.scope==='video'?'问这段视频…':route.scope==='kb'?'向知识库提问…':'向视频库提问…'}" ${running?'disabled':''}></textarea>${running?'<button class="send" type="button" data-a="stop-chat" aria-label="停止生成">■</button>':`<button class="send" type="submit" aria-label="发送问题">${ico('send')}</button>`}</div></form></div><aside class="chat-rail"><div class="between"><h3>本轮研究</h3>${tag('模拟数据')}</div><nav class="tabs"><button data-a="chat-rail-tab" data-id="run" class="${ui.chatRail==='run'?'active':''}">执行过程</button><button data-a="chat-rail-tab" data-id="evidence" class="${ui.chatRail==='evidence'?'active':''}">来源证据</button></nav>${ui.chatRail==='run'?traceView(running?ui.run.progress:4,s):source.map(v=>`<div style="margin-bottom:16px"><h3>${esc(v.title)}</h3>${v.chapters.slice(0,2).map(([t,text],i)=>`<button class="timeline-row" data-a="evidence" data-id="${v.id}" data-chapter="${i}"><span class="time">${t}</span><span style="font-size:11px;color:var(--muted)">${esc(text)}</span></button>`).join('')}</div>`).join('')}<div class="divider" style="border-top:1px solid var(--line);margin:20px 0"></div><h3>这个范围的成果</h3>${db.artifacts.filter(a=>a.sources.some(id=>source.some(v=>v.id===id))).slice(0,2).map(a=>`<a class="list-row" style="padding:10px 0" href="#/artifacts/${a.id}">${ico(recipe(a.kind).icon)}<span class="grow" style="font-size:11px">${esc(a.title)}</span>${ico('chevron')}</a>`).join('')}${btn('生成成果','generate-chat','','small','spark')}<div class="setting-row"><div><b style="font-size:11px">本次会话的记忆</b><p>仅影响回答偏好，事实仍以证据为准。</p><select aria-label="会话记忆策略" id="sessionMemory" style="font-size:10px;margin-top:9px;max-width:220px"><option value="inherit">沿用默认设置</option><option value="on" ${s.memory==='on'?'selected':''}>在此会话开启</option><option value="off" ${s.memory==='off'?'selected':''}>在此会话关闭</option></select></div></div></aside></div>`}
function answerView(m,s,index){const ids=s.scope==='video'?[s.target]:s.scope==='kb'?(kb(s.target)?.videos||[]).filter(id=>video(id)?.status==='ready'):ready().map(v=>v.id),v=video(ids[0]);return `<article class="answer"><div class="answer-head">${logo()}映知<span>·</span>${s.mode==='agent'?'Agent':'Chat'}<span class="grow"></span>${tag('已完成','green')}</div><div class="answer-content">${m.cancelled?'<p>本轮模拟生成已停止。你可以修改问题后重新发送。</p>':m.kind==='build'?`<h3>编译环境与运行环境，承担不同职责。</h3><p>第一阶段使用 Go 工具链完成编译；第二阶段只复制运行需要的文件。视频中的 <code>COPY --from=builder</code> 正是连接两个阶段的步骤。${citation(1,1)}</p><ol><li><b>构建阶段：</b>下载依赖、编译代码，产出可执行文件。</li><li><b>运行阶段：</b>保留应用与必要的运行时依赖，构建工具不会一起进入镜像。</li></ol><p>这份示例使用 <code>CGO_ENABLED=0</code>。如果项目依赖 CGO，需要另外检查运行时库，不能直接照搬配置。</p>`:m.kind==='compare'?`<h3>先对齐部署环境，再比较连接方式。</h3><p>单个容器与 Compose 网络中的应用，连接数据库的地址可能不同。<b>这不一定是课程结论互相矛盾，而是前提不同。</b></p><ol><li><b>镜像构建：</b>先区分编译与运行阶段。${citation(ids[0]||1,1)}</li><li><b>服务编排：</b>同一 Compose 网络中，可用服务名连接数据库；localhost 指向容器自身。${citation(ids[1]||ids[0]||2,1)}</li><li><b>上线验证：</b>进程存活不代表服务已就绪，还要检查实际依赖。${citation(ids[2]||ids[0]||3,1)}</li></ol><p>可以把本轮研究整理成对照表，再记录自己的部署选择。</p>`:`<h3>围绕当前范围，可以先关注这些内容。</h3><p>${esc(m.text)}以下是用于体验问答流程的模拟整理，并未调用模型。</p><ol>${ids.slice(0,3).map(id=>{const x=video(id);return `<li><b>${esc(x.title)}</b>：${esc(x.chapters[1]?.[1]||x.chapters[0][1])}${citation(id,Math.min(1,x.chapters.length-1))}</li>`}).join('')}</ol>`}</div><div class="answer-actions"><small>模拟回答 · 来源可回看</small><button class="ib" data-a="feedback" data-id="${s.id}-${index}" aria-label="这个回答有帮助">${ico(db.feedback[s.id+'-'+index]?'check':'thumb')}</button>${btn('整理成成果','generate-answer',index,'small','spark')}</div></article>`}
function citation(id,ch=0){const v=video(id);return v?`<button class="citation" data-a="evidence" data-id="${id}" data-chapter="${ch}">${ico('play')}${v.chapters[ch]?.[0]||'00:00'}</button>`:''}
function traceView(progress,s){return `<div class="row" style="margin-bottom:20px">${tag(progress<4?'进行中':'已完成',progress<4?'gold':'green')}<span class="dim mono" style="font-size:9px">RUN-${String(s.id).padStart(4,'0')} · 示例</span></div>${[['理解任务','确认问题目标与当前证据范围。','scope → '+scopeTitle()],['检索相关片段','在已授权的来源中寻找相关文字与画面。','search_video / retrieve_evidence'],['核对原文与画面','把关键结论放回视频片段，检查适用前提。','inspect_frame / read_transcript'],['组织回答','保留引用，指出尚未覆盖的内容。','answer with source references']].map(([t,p,detail],i)=>`<div class="trace ${i>=progress?'pending':''}"><b>${t}</b><p>${i>progress?'等待前一步完成':p}</p><details><summary>查看步骤详情</summary><pre>${esc(detail)}\n执行记录为原型示例</pre></details></div>`).join('')}<div class="budget"><div><strong>${Math.min(progress+1,4)} / 8</strong><small>工具调用 · 模拟</small></div><div><strong>${progress<4?'运行中':'12.4s'}</strong><small>本轮用时 · 模拟</small></div></div>`}
function artifactCard(a){const r=recipe(a.kind);return `<a class="artifact-card" href="#/artifacts/${a.id}"><div class="artifact-cover">${a.kind==='map'?'<svg viewBox="0 0 250 100" width="240" height="110"><g fill="none" stroke="#aa8648"><path d="M70 50C115 50 95 20 140 20M70 50h70M70 50C115 50 95 80 140 80"/></g><g fill="#4e412b" stroke="#8f7549"><rect x="5" y="35" width="70" height="30" rx="5"/><rect x="140" y="9" width="95" height="22" rx="4"/><rect x="140" y="39" width="95" height="22" rx="4"/><rect x="140" y="69" width="95" height="22" rx="4"/></g><g fill="#d8c4a0" font-size="9" text-anchor="middle"><text x="40" y="54">Go 服务部署</text><text x="187" y="24">构建与交付</text><text x="187" y="54">编排与连接</text><text x="187" y="84">运行与验证</text></g></svg>':`<div class="paper-mini" style="${a.kind==='compare'?'transform:rotate(3deg);width:185px':''}"><b>${r.name} / VIDLENS</b><i></i><i></i><i></i><i></i><i></i></div>`}<span class="tag" style="position:absolute;right:12px;top:12px;background:var(--panel)">v${a.version}</span></div><div class="pad"><h3>${esc(a.title)}</h3><p>${r.name} · ${a.sources.length} 个视频来源</p><div class="between">${tag(a.custom?'新草稿':'已保存',a.custom?'gold':'green')}<small class="dim" style="font-size:10px">${a.date}</small></div></div></a>`}
function artifactsView(){const list=db.artifacts.filter(a=>ui.artifactFilter==='all'||a.kind===ui.artifactFilter);return `<div class="page">${heading('成果','视频仍在原处，理解在这里沉淀。每份成果都能继续编辑、回看来源。',btn('生成新成果','generate-global','','primary','spark'))}<div class="toolbar"><div class="segments">${[{id:'all',name:'全部'},...recipes].map(r=>`<button data-a="artifact-filter" data-id="${r.id}" class="${ui.artifactFilter===r.id?'active':''}">${r.name}</button>`).join('')}</div><span class="grow"></span><small class="dim">${list.length} 份成果</small></div><div class="artifact-grid">${list.map(artifactCard).join('')}</div>${list.length?'':empty('还没有这类成果','从一个视频、一组课程或一轮回答开始整理。',btn('生成成果','generate-global','','primary'))}</div>`}
function artifactView(){const a=db.artifacts.find(a=>a.id===route.id);if(!a)return notFound();return `<div class="artifact-workspace"><div class="artifact-head"><span class="icon-tile" style="height:34px;width:34px">${ico(recipe(a.kind).icon)}</span><div class="grow"><h2>${esc(a.title)}</h2><small>${recipe(a.kind).name} · 来自${a.origin} · ${a.sources.length} 个视频 · ${a.custom?'新生成的模拟草稿':'示例成果'}</small></div>${btn('来源视频','artifact-sources',a.id,'small','video')}${kb(a.kb)?link('返回知识库','/kb/'+a.kb,'btn small ghost','folder'):link('返回视频','/video/'+a.sources[0],'btn small ghost','arrow')}${btn('','artifact-menu',a.id,'small ghost','more')}</div><iframe class="artifact-frame" style="visibility:hidden" id="artifactFrame" title="${esc(a.title)}编辑器" sandbox="allow-scripts allow-same-origin allow-downloads"></iframe></div>`}
function jobPhase(j){return (j.type==='artifact'?['读取来源内容','整理结构与证据','检查缺口与一致性','保存成果']:j.job==='download'?['创建下载任务','获取视频资料（模拟）','保存视频文件','等待手动转写']:j.job==='index'?['准备索引片段','生成向量','写入检索索引','完成检查']:['识别音频与转写','理解画面与 OCR','组织内容与摘要','建立检索索引'])[Math.min(j.progress,3)]}
function tasksView(){const list=db.jobs.filter(j=>ui.taskFilter==='all'||j.status===ui.taskFilter);return `<div class="page">${heading('任务中心','视频处理与成果生成集中查看。离开页面后，模拟任务仍会继续。')}<div class="toolbar"><div class="segments">${[['all','全部'],['running','进行中'],['completed','已完成'],['failed','失败'],['cancelled','已取消']].map(([id,t])=>`<button data-a="task-filter" data-id="${id}" class="${ui.taskFilter===id?'active':''}">${t}</button>`).join('')}</div><span class="grow"></span>${tag('本地模拟任务')}</div><div class="card table-wrap"><table class="task-table"><thead><tr><th>任务</th><th>类型</th><th>状态与进度</th><th>操作</th></tr></thead><tbody>${list.map(j=>`<tr><td><b>${esc(j.title)}</b><small>${j.created?new Date(j.created).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'昨天 18:03'} · ${j.type==='artifact'?'来源范围已保存':'视频文件已保留'}</small></td><td>${j.type==='artifact'?recipe(j.kind).name:j.job==='index'?'检索索引':'视频处理'}</td><td>${tag({running:jobPhase(j),completed:'已完成',failed:'处理失败',cancelled:'已取消'}[j.status],{running:'gold',completed:'green',failed:'red'}[j.status]||'')}${j.status==='running'?`<div class="progress"><i style="width:${j.progress*25+8}%"></i></div>`:''}</td><td><div class="row">${btn('详情','job-detail',j.id,'small ghost')}${j.status==='running'?btn('取消','cancel-job',j.id,'small'):j.status==='completed'?link('查看',j.type==='artifact'?'/artifacts/'+j.artifact:'/video/'+j.video,'btn small'):btn('重试','retry-job',j.id,'small','refresh')}</div></td></tr>`).join('')}</tbody></table></div>${list.length?'':empty('这个列表暂时没有任务','可以导入视频，或从现有内容生成一份成果。')}</div>`}
function retrievalView(){const k=kb(route.id);if(!k)return notFound();const hits=k.videos.map(video).filter(v=>v?.status==='ready');return `<div class="page">${heading('检索测试台',`${esc(k.name)} · 观察问题如何被转换为可引用的来源。`,link('返回研究工作区','/chat/kb/'+k.id,'btn ghost','message'))}<form id="retrievalForm" class="card pad"><label class="field" style="margin-top:0">检索问题<textarea id="retrievalQuery" rows="3" placeholder="输入需要定位的术语、观点或问题…">${esc(ui.retrievalQuery)}</textarea></label><div class="row"><span class="tag">${hits.length} 个可检索视频</span><label class="muted" style="font-size:12px">返回 <select id="topK" aria-label="返回证据数量"><option>3</option><option>5</option><option>10</option></select> 条</label><span class="grow"></span><button type="submit" class="btn primary">${ico('search')}检索证据</button></div></form>${ui.retrievalReady?`<div class="row wrap" style="margin:23px 0">${tag('关键词召回','green')} → ${tag('语义召回','green')} → ${tag('融合与重排','green')}<span class="grow"></span><small class="dim">固定示例结果 · 非真实检索评分</small></div>${hits.slice(0,ui.topK||3).map((v,i)=>`<article class="retrieval-hit"><div class="between"><h3><span class="mono" style="color:var(--gold);margin-right:9px">0${i+1}</span>${esc(v.title)}</h3>${btn('回看','evidence',v.id,'small','play')}</div><p>${esc(v.chapters[1]?.[1]||v.chapters[0][1])}</p><div class="row">${tag('转写')}<span>${v.chapters[1]?.[0]||v.chapters[0][0]}</span><span class="grow"></span><span>相关度 ${(0.93-i*.06).toFixed(2)} · 模拟</span></div></article>`).join('')}`:`<div style="margin-top:20px">${empty('输入问题，检查检索依据','这里保留现有检索测试台；原型展示固定的证据命中与阶段。')}</div>`}</div>`}
function settingsView(){return `<div class="page">${heading('设置','管理模型配置、长期记忆和提示词偏好。')}<div class="settings-layout"><nav class="settings-nav">${[['ai','AI 服务'],['memory','记忆治理'],['prompts','提示词'],['appearance','外观'],['account','账号与演示']].map(([id,t])=>`<button data-a="settings-tab" data-id="${id}" class="${ui.settingsTab===id?'active':''}">${t}</button>`).join('')}</nav><section>${settingsPanel()}</section></div></div>`}
function settingsPanel(){if(ui.settingsTab==='ai')return `<div class="between" style="margin-bottom:20px"><h2>AI 服务配置</h2><div class="row">${btn('导入配置','import-profile','','small','upload')}${btn('添加配置','new-profile','','small','plus')}</div></div><div class="notice" style="margin-bottom:20px">${ico('shield')}<span>这里演示配置管理与能力检查。请勿输入真实密钥；原型不连接任何模型服务。</span></div>${db.profiles.map(p=>`<div class="profile-card"><div class="between"><h3>${esc(p.name)}　${p.default?tag('默认','gold'):''}</h3>${btn('编辑','edit-profile',p.id,'small ghost','edit')}</div><div class="models">${[['对话 / 推理',p.llm],['语音识别',p.asr],['视觉理解',p.vision],['向量检索',p.embedding]].map(([l,m])=>`<div>${l}<b>${esc(m)}</b></div>`).join('')}</div><div class="row">${btn('能力检查','probe-profile',p.id,'small','target')}${!p.default?btn('设为默认','default-profile',p.id,'small ghost'):''}${btn('导出','export-profile',p.id,'small ghost','download')}${btn('删除','delete-profile',p.id,'small ghost danger','trash')}</div></div>`).join('')}`;if(ui.settingsTab==='memory')return `<h2>记忆治理</h2><div class="setting-row"><div><b>个人长期记忆</b><p>记住回答偏好与明确表达的需求。视频事实仍从当前来源检索，记忆不替代证据。</p></div><button class="switch ${db.memory?'on':''}" role="switch" aria-label="个人长期记忆" aria-checked="${db.memory}" data-a="memory-toggle"></button></div>${db.memories.map(m=>`<div class="memory-item"><div class="between"><b>${esc(m.text)}</b>${tag(m.active?'参与召回':'已撤回',m.active?'green':'')}</div><p>${m.scope} · 用户明确偏好 · 模拟记录</p>${btn(m.active?'撤回':'恢复','memory-revoke',m.id,'small ghost')}${btn('删除','memory-delete',m.id,'small ghost danger')}</div>`).join('')}<p class="route-note" style="margin-top:20px">会话里可以单独选择记忆策略。撤回只停止召回，不会改变视频资料。</p>`;if(ui.settingsTab==='prompts')return `<h2>提示词偏好</h2><p class="muted" style="font-size:12px;margin:10px 0 20px">保留证据和事实约束，在它们之内调整输出表达。</p><form id="promptForm">${[['summary','摘要偏好'],['chat','回答偏好'],['vision','画面描述偏好']].map(([id,t])=>`<label class="field">${t}<textarea name="${id}" rows="3">${esc(db.prompts[id])}</textarea></label>`).join('')}<button class="btn primary" type="submit">保存偏好</button></form>`;if(ui.settingsTab==='appearance')return `<h2>外观</h2><div class="two" style="margin-top:20px">${[['dark','深色放映厅','#141210'],['light','浅色阅读','#f3efe6']].map(([id,t,c])=>`<button class="card pad" data-a="set-theme" data-id="${id}" style="text-align:left;border-color:${db.theme===id?'var(--gold)':'var(--line)'}"><div style="height:100px;background:${c};border-radius:7px;border:1px solid #8883;padding:20px;margin-bottom:15px"><div style="width:45%;height:6px;background:#e2a84b88;margin:12px 0"></div><div style="width:85%;height:4px;background:#8885;margin:10px 0"></div><div style="width:70%;height:4px;background:#8885"></div></div><b>${t}</b>${db.theme===id?'　✓':''}</button>`).join('')}</div>`;return `<h2>账号与演示</h2><div class="setting-row"><div><b>我的工作区</b><p>所有操作只影响此原型的浏览器存储。</p></div>${link('退出演示账号','/login','btn small')}</div><div class="setting-row"><div><b>恢复原型初始数据</b><p>移除本原型内新增的演示视频、会话和成果；不会访问真实 VidLens 数据。</p></div>${btn('恢复演示','reset-demo','','small')}</div>${link('产品介绍','/intro','btn ghost')}`}
function docsView(){const bodies={start:`<h2>从视频开始，到成果结束</h2><p>映知保留原有的视频处理、问答与知识库。成果是理解之后的下一步，每份成果都保留所选视频的来源。</p><ol><li><a href="#/library">导入视频</a>：选择本地文件或填写视频链接。上传完成后，在详情页开始转写。</li><li><a href="#/video/1">理解内容</a>：播放预览、阅读转写时间轴、查看画面 OCR 与检索索引。</li><li><a href="#/chat/video/1">继续提问</a>：Chat 回答具体问题；Agent 展开多步查证，并展示执行过程。</li><li><a href="#/kb/1">组织知识库</a>：把相关视频放在一起，做跨视频研究、比较和检索测试。</li><li><a href="#/artifacts">保存成果</a>：从视频、知识库或回答生成手册、笔记、对照表与导图，继续编辑和回看。</li></ol>`,scope:`<h2>三种问答范围</h2><h3>单视频</h3><p>从视频详情进入，只使用当前视频。可切换 Chat 与 Agent。</p><h3>知识库</h3><p>只检索这个知识库的成员视频。支持 Chat 与跨视频研究，适合比较课程的不同前提。</p><h3>整个视频库</h3><p>使用当前已建立索引的视频进行 Chat 检索问答。原型保持这个模式边界。</p>`,artifacts:`<h2>成果如何与原来的功能共存</h2><p>视频详情仍是来源入口，问答仍用于追问和研究。成果在需要长期保存、编辑、实践或复习时创建。</p><h3>四种成果</h3><p>操作手册保留步骤和代码；学习笔记提供概念与练习；课程对照展示观点及前提；知识导图提供结构化视图。</p><p>“来源视频”可返回原始资料，“返回知识库”可继续研究；新生成任务在任务中心查看。</p>`,limits:`<h2>这份原型的边界</h2><p>页面、资料、转写、画面、问答、执行记录与模型配置都是演示数据。选择文件只读取文件名，不上传内容；输入链接不访问目标网站。</p><p>任务由本地计时器推进。问答和生成内容使用固定模板与模拟资料，不调用 AI。修改保存在当前浏览器。</p><p>真实视频播放、ASR、模型调用、权限校验与后台任务要在正式开发时连接后端。Markdown/SVG 导出依赖浏览器下载能力。</p>`};return `<div class="page">${heading('使用文档','了解原有功能与新增成果能力的完整路径。')}<div class="doc-layout"><nav class="doc-nav">${[['start','快速开始'],['scope','问答范围'],['artifacts','成果与来源'],['limits','原型说明']].map(([id,t])=>`<button class="${ui.doc===id?'active':''}" data-a="doc-tab" data-id="${id}">${t}</button>`).join('')}${link('产品介绍 ↗','/intro','')}</nav><article class="prose">${bodies[ui.doc]}</article></div></div>`}
function introView(){return `<div class="page"><div class="intro-hero"><div class="eyebrow">VIDLENS · 从看过，到理解，再到用上</div><h1>让视频里的知识，<br>成为你手里的能力。</h1><p>转写与画面理解，让内容可寻找；有来源的问答，让理解可核对；可编辑的成果，让学过的东西可以继续使用。</p><div class="row">${link('进入工作台','/','btn primary','arrow')}${btn('导入视频','upload','','','plus')}</div></div><div class="stage-lines">${[['video','视频资料','保留时间轴、画面与原始来源'],['message','对话与研究','单视频与跨视频，多步核对'],['layers','可使用的成果','手册、笔记、对照与导图']].map(([i,t,p],n)=>`${n?ico('arrow'):''}<div class="card">${ico(i)}<b>${t}</b><p>${p}</p></div>`).join('')}</div><div class="notice">${ico('help')}这是基于现有 VidLens 信息架构的完整交互原型。页面均可进入，核心流程使用本地模拟数据。</div></div>`}
function loginView(){return `<div class="login"><section class="login-scene"><a class="brand" href="#/intro">${logo()}<span><b>映知</b><small>VIDLENS</small></span></a><div class="projector"><div class="projector-ring"></div></div><div class="eyebrow">WATCH. UNDERSTAND. MAKE IT YOURS.</div><h1>视频里的每一个瞬间，<br>都可以成为新的理解。</h1><p>从有证据的问答，到可以带走的学习成果。</p></section><section class="login-form"><div class="segments"><button data-a="login-mode" data-id="login" class="${ui.loginMode==='login'?'active':''}">登录</button><button data-a="login-mode" data-id="register" class="${ui.loginMode==='register'?'active':''}">注册</button></div><h2>${ui.loginMode==='login'?'欢迎回到映知':'建立你的知识工作区'}</h2><p>原型演示，请使用任意测试信息。</p><form id="loginForm">${ui.loginMode==='register'?'<label class="field">昵称<input name="nickname" placeholder="显示名（可选）"></label>':''}<label class="field">用户名<input name="username" required minlength="2" placeholder="演示用户名" autocomplete="off"></label><label class="field">密码<input type="password" name="password" required minlength="6" placeholder="任意 6 位以上测试字符" autocomplete="off"><small>不会保存或发送此处输入的信息。</small></label><button type="submit" class="btn primary">${ui.loginMode==='login'?'进入工作区':'注册并进入'}（模拟）</button></form><button class="btn" data-a="demo-login">${ico('play')}直接体验演示</button><div class="login-links">${link('产品介绍','/intro','')}${link('使用文档','/docs','')}</div></section></div>`}
function notFound(){return `<div class="page">${empty('这个内容不存在','可能已从原型中移除。你可以返回工作台。',link('返回工作台','/','btn primary'))}</div>`}
function showModal(name,id){ui.returnFocus=document.activeElement;ui.modal=name;ui.modalID=Number(id)||0;ui.modalError='';renderModal();$('#modal .close')?.focus()}
function closeModal(){ui.modal=null;$('#modal').innerHTML='';ui.returnFocus?.isConnected&&ui.returnFocus.focus()}
function modal(title,desc,body,wide=false){return `<div class="modal-veil" data-a="veil"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">${title}</h2><p>${desc}</p></div><button class="ib close" data-a="close-modal" aria-label="关闭弹窗">${ico('x')}</button></div>${body}${ui.modalError?`<div class="error-text" role="alert">${esc(ui.modalError)}</div>`:''}</section></div>`}
function footer(buttons,note=''){return `<div class="modal-foot">${note?`<small>${note}</small>`:''}${buttons}</div>`}

if(ui.modal==='job-detail'){const j=db.jobs.find(j=>j.id===id);html=modal('任务详情',esc(j?.title),j?`<div class="row">${tag({running:'进行中',completed:'已完成',failed:'失败',cancelled:'已取消'}[j.status],{running:'gold',completed:'green',failed:'red'}[j.status]||'')}<small class="dim mono">TASK-${String(j.id).padStart(4,'0')}</small></div><div style="margin:24px 0">${[0,1,2,3].map(i=>`<div class="trace ${i>=j.progress?'pending':''}"><b>${jobPhase({...j,progress:i})}</b><p>${j.status==='failed'&&i===j.progress?esc(j.error):i<j.progress?'已完成':j.status==='cancelled'?'未继续执行':i===j.progress?'等待或执行中':'等待前一步完成'}</p></div>`).join('')}</div>${j.status==='failed'?`<div class="notice error">${ico('alert')}${esc(j.error)}</div>`:''}${footer(j.status==='running'?btn('在后台继续','close-modal')+btn('取消任务','cancel-job',j.id):j.status==='completed'?btn('关闭','close-modal')+btn('查看结果','job-result',j.id,'primary','arrow'):btn('关闭','close-modal')+btn('重试','retry-job',j.id,'primary','refresh'))}`:'任务不存在。')}

if(ui.modal==='artifact-sources'){const a=db.artifacts.find(a=>a.id===id);html=modal('这份成果的来源',esc(a?.title),`${artifactVideos(a).map(v=>video(v.id)?`<a class="list-row" href="#/video/${v.id}" data-close>${ico('video')}<span class="grow"><b>${esc(v.title)}</b><p>${v.duration} · ${v.file}</p></span>${ico('arrow')}</a>`:`<div class="list-row">${ico('video')}<span class="grow"><b>${esc(v.title)}</b><p>来源已从视频库移除，成果保留生成时的模拟快照。</p></span>${tag('来源已移除')}</div>`).join('')}${footer(btn('继续编辑','close-modal'))}`)}

if(ui.modal==='new-profile'||ui.modal==='edit-profile'){const p=db.profiles.find(p=>p.id===id);html=modal(p?'编辑 AI 配置':'添加 AI 配置','保留四类模型、服务地址、上下文与执行预算。所有值只在原型内保存。',`<label class="field">配置名称<input id="profileName" value="${esc(p?.name||'')}" placeholder="例如：技术课程学习"></label><div class="two">${[['llm','对话 / 推理'],['asr','语音识别'],['vision','视觉理解'],['embedding','向量检索']].map(([k,t])=>`<div><label class="field">${t}模型<input id="profile-${k}" value="${esc(p?.[k]||{llm:'对话模型 · 示例',asr:'Whisper',vision:'视觉模型 · 示例',embedding:'BAAI/bge-m3'}[k])}"></label><label class="field">${k==='embedding'?'完整请求地址':'服务 Base URL'}<input id="endpoint-${k}" value="${esc(p?.endpoints?.[k]||('https://api.example/v1'+(k==='embedding'?'/embeddings':'')))}"></label></div>`).join('')}</div><div class="two"><label class="field">对话上下文窗口<input id="profileContext" type="number" min="1" value="${p?.context||32768}"></label><label class="field">向量维度<input id="profileDimension" type="number" min="1" value="${p?.dimension||1024}"></label></div><label class="field">API Key<input type="password" disabled placeholder="原型不收集真实密钥，也不发起服务请求"></label><details class="profile-budget"><summary>Agent 执行预算</summary><p class="muted" style="font-size:12px;line-height:1.8;margin:12px 0">仅影响后续 Agent 运行，普通 Chat 与正在进行的运行不受影响。以下是可编辑的模拟预算。</p><label class="field">预算策略<select id="budgetMode"><option value="default" ${!p?.customBudget?'selected':''}>跟随服务端默认值</option><option value="custom" ${p?.customBudget?'selected':''}>使用自定义预算</option></select></label><div class="two">${budgetFields.map(([key,label,value])=>`<label class="field">${label}<input id="budget-${key}" type="number" min="1" value="${p?.budget?.[key]||value}"></label>`).join('')}</div></details>${footer(btn('取消','close-modal')+btn('保存配置','save-profile',id,'primary'))}`,true)}

function confirmAction(title,text,action,label){ui.confirmTitle=title;ui.confirmText=text;ui.confirmFn=action;ui.confirmLabel=label;showModal('confirm')}
function openGeneration(sources,origin,k=0,kind='manual'){ui.genSources=sources.filter(id=>video(id)?.status==='ready');ui.genOrigin=origin;ui.genKB=k;ui.recipe=kind;ui.wizardStep=1;ui.genTitle='';ui.genGoal='';showModal('generate')}
function readGeneration(){if($('#genTitle'))ui.genTitle=$('#genTitle').value;ui.genSources=$$('.genSource:checked').map(x=>Number(x.value));ui.genGoal=$('#genGoal')?.value||''}
function addJob(input){const j={id:nextId(db.jobs),status:'running',progress:0,created:Date.now(),...input};db.jobs.unshift(j);if(j.video){j.previousStatus=video(j.video)?.status;if(video(j.video))video(j.video).status='processing'}save();return j}
function runVideo(id,job='transcribe'){const v=video(id);if(!v)return;if(db.jobs.some(j=>j.video===id&&j.status==='running')){toast('这个视频已有任务在运行。');return}const j=addJob({type:'video',video:id,title:v.title,job});closeModal();renderPage();showModal('job-detail',j.id)}
function tickJobs(){let changed=false;for(const j of db.jobs){if(j.status!=='running')continue;const step=Math.min(4,Math.floor((Date.now()-j.created)/1900));if(step===j.progress)continue;j.progress=step;changed=true;if(step===4){j.status='completed';if(j.type==='video'){const v=video(j.video);if(v){v.status=j.job==='download'?'uploaded':'ready';v.summary=j.job==='download'?false:true}}else{const a={id:nextId(db.artifacts),kind:j.kind,title:j.title,sources:[...j.sources],kb:j.kb,origin:j.origin,date:'刚刚',version:1,custom:true,goal:j.goal||'',snapshot:j.sources.map(video).filter(Boolean).map(v=>structuredClone(v))};db.artifacts.unshift(a);j.artifact=a.id}toast(`“${j.title}”已完成。`)}}if(changed){save();const count=document.querySelector('.rail a[href="#/artifacts"] small');if(count)count.textContent=db.artifacts.length;if(['home','tasks','video'].includes(route.name)&&!$('#renameTitle'))renderPage();if(ui.modal==='job-detail')renderModal()}}
function retryJob(id){const old=db.jobs.find(j=>j.id===id);if(!old)return;const input={...old,id:nextId(db.jobs),status:'running',progress:0,created:Date.now()};delete input.artifact;db.jobs.unshift(input);if(input.video&&video(input.video))video(input.video).status='processing';save();renderPage();showModal('job-detail',input.id)}
function cancelJob(id){const j=db.jobs.find(x=>x.id===id);if(!j||j.status!=='running')return;j.status='cancelled';if(j.video&&video(j.video))video(j.video).status=j.previousStatus==='ready'?'ready':'uploaded';save();renderPage();if(ui.modal==='job-detail')renderModal();toast('任务已取消，已有资料和成果保留。')}
function openEvidence(id,ch=0){const v=video(id);if(!v)return;ui.drawer={video:id,chapter:Math.min(ch,v.chapters.length-1)};ui.videoTime=seconds(v.chapters[ui.drawer.chapter][0]);renderDrawer()}
function renderDrawer(){if(!ui.drawer){$('#drawer').innerHTML='';return}const v=video(ui.drawer.video),[time,text]=v.chapters[ui.drawer.chapter];$('#drawer').innerHTML=`<div class="drawer-veil" data-a="close-drawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="evidenceTitle"><div class="between"><h2 id="evidenceTitle">回到视频证据</h2><button class="ib" data-a="close-drawer" aria-label="关闭证据抽屉">${ico('x')}</button></div>${screen(v,seconds(time))}<h3 style="margin:20px 0 10px">${esc(v.title)}</h3><div class="row">${tag('解说转写','gold')}<span class="mono muted" style="font-size:11px">${time} · 模拟时间码</span></div><blockquote>${esc(text)}</blockquote><p class="route-note">来源限定在当前视频。原型中的画面、转写与时间码均为示例。</p><div class="row" style="margin-top:25px">${btn('打开视频详情','drawer-video',v.id,'primary','video')}${btn('关闭','close-drawer')}</div></aside>`;$('#drawer .ib')?.focus()}
function startChat(text){if(ui.run){toast('已有模拟回答正在生成。');return}const s=chatSession();if(!text.trim())return;s.messages.push({role:'user',text:text.trim()});if(s.title==='新会话')s.title=text.trim().slice(0,30);save();ui.run={session:s.id,progress:0,text,created:Date.now()};renderPage();ui.runTimer=setInterval(()=>{if(!ui.run){clearInterval(ui.runTimer);return}ui.run.progress++;if(ui.run.progress>=4){const current=db.sessions.find(x=>x.id===ui.run.session);current?.messages.push({role:'assistant',text:ui.run.text,kind:current.scope==='kb'&&current.target===1?'compare':current.scope==='video'&&current.target===1?'build':'general'});ui.run=null;clearInterval(ui.runTimer);save();renderPage();return}if(route.name==='conversation')renderPage()},1000)}
function newChat(){if(ui.run){toast('请先停止当前生成。');return}const s={id:nextId(db.sessions),scope:route.scope,target:route.target,title:'新会话',mode:route.scope==='kb'?'agent':'chat',messages:[]};db.sessions.unshift(s);ui.activeSessions[route.scope+route.target]=s.id;save();closeModal();renderPage()}
function download(name,text,type='text/plain;charset=utf-8'){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('已发起下载；也可以复制预览文本。')}
