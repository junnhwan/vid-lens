<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VidLens</title>
    <meta
      name="description"
      content="循着原视频的文字与真实画面，把视频读成一篇带出处的图文，读完还可以继续提问。"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/instrument-serif-latin-400-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/instrument-serif-latin-400-italic.woff2"
      crossorigin
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="alternate icon" href="/favicon.ico?v=2" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32.png?v=2"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16.png?v=2"
    />
    <script>
      try {
        var p = localStorage.getItem("vidlens-theme");
        document.documentElement.dataset.theme =
          p === "light" || p === "dark"
            ? p
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (e) {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
